unique_name: Date Dimension
object_type: dimension
label: Date Dimension
description: >-
  Calendar date dimension (Year > Quarter > Month > Day), role-played as
  snapshot, fiscal and accident month-end.
hierarchies:
  - unique_name: Date Hierarchy
    label: Date Hierarchy
    filter_empty: 'yes'
    folder: Date Attributes
    levels:
      - unique_name: Year
      - unique_name: Quarter
      - unique_name: Month
      - unique_name: Date Level
level_attributes:
  - unique_name: Year
    label: Year
    dataset: TDIM_DATE
    key_columns:
      - YEAR_NO
    name_column: YEAR_NO
    sort_column: YEAR_NO
    time_unit: year
  - unique_name: Quarter
    label: Quarter
    dataset: TDIM_DATE
    key_columns:
      - YEAR_NO
      - QUARTER_NO
    name_column: QUARTER_NO
    time_unit: quarter
  - unique_name: Month
    label: Month
    dataset: TDIM_DATE
    key_columns:
      - YEAR_NO
      - MONTH_NO
    name_column: MONTH_NM
    sort_column: MONTH_YEAR_NO
    time_unit: month
  - unique_name: Date Level
    label: Date Level
    dataset: TDIM_DATE
    is_unique_key: true
    key_columns:
      - DIM_DATE_ID
    name_column: FULL_DT
    sort_column: DIM_DATE_ID
    time_unit: day
type: time
